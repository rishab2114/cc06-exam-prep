version: "3.9"

# Local infra for CampusBuddy NTU development.
# Postgres (with PostGIS) for the relational store + Redis for BullMQ jobs/cache/rate-limit.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campusbuddy-postgres
    environment:
      POSTGRES_USER: campusbuddy
      POSTGRES_PASSWORD: campusbuddy
      POSTGRES_DB: campusbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusbuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campusbuddy-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
